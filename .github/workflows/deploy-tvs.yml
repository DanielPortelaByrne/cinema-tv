name: Deploy to the TVs

# Keeps the TVs on the newest main. A merge builds a signed release and installs it on each TV in the quiet hours
# (01:00 to 06:00 London time). A TV that is offline or playing is retried by the hourly schedule.
# The deploy runs on the home-network runner because the TVs are only reachable from the home network.
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 0-5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tv-deploy-cinema
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Release signing key
        env:
          KEYSTORE_B64: ${{ secrets.CINEMA_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.CINEMA_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.CINEMA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.CINEMA_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > release.jks
          printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties
      - name: Build the release APK
        run: ./gradlew --no-daemon :app:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: cinema-tv-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 7

  deploy:
    needs: build
    runs-on: [self-hosted, cinema-devices, steamdeck]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: cinema-tv-release-apk
          path: artifacts
      - name: Install on the TVs in the quiet hours
        env:
          TV_ADDRESSES: ${{ vars.TV_ADDRESSES }}
        run: scripts/ci/deploy-tvs.sh artifacts/app-release.apk cinema "$GITHUB_EVENT_NAME"
